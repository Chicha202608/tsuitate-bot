name: Input A/B train

# input-ab.yml の学習の1段（呼び出し専用。単独では走らない）。
# 1ランナー = 4本（1本 1スレッド）の小さい自己対局を stage_minutes 分まで回し、run の状態を丸ごと artifact
# `iab-train-<シャード>` に置く。2段目以降は前の段の artifact を取ってきて checkpoint から続け、同じ名前で置き直す
# （届いていれば何もしない）。学習側は tsuitate-nn の rnad/input_ab.py。
on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      shards:
        description: "JSON の配列 [{id, only}]（scripts/ci/input_ab.py plan）"
        type: string
        required: true
      arms:
        type: string
        required: true
      extra_arms:
        description: "JSON {名前: 引数}"
        type: string
        required: true
      seeds:
        type: string
        required: true
      steps:
        type: string
        required: true
      export_every:
        type: string
        required: true
      stage_minutes:
        type: string
        required: true
      nn_ref:
        type: string
        required: true

jobs:
  train:
    name: train${{ inputs.stage }} (${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(inputs.shards) }}
    env:
      ARMS: ${{ inputs.arms }}
      EXTRA_ARMS: ${{ inputs.extra_arms }}
      SEEDS: ${{ inputs.seeds }}
      ONLY: ${{ matrix.shard.only }}
      STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout tsuitate-nn
        uses: actions/checkout@v5
        with:
          repository: tempakyousuke/tsuitate-nn
          ref: ${{ inputs.nn_ref }}
          path: nn
      - name: Previous stage
        if: ${{ inputs.stage > 1 }}
        # 前の段がこのシャードを置けていなければ（ジョブごと落ちた）、最初から回す
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: iab-train-${{ matrix.shard.id }}
          path: iab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pending
        id: pending
        run: |
          set -euo pipefail
          mkdir -p iab
          args=(--root "$GITHUB_WORKSPACE/iab" --arms "$ARMS" --seeds "$SEEDS" --only "$ONLY" --steps "$STEPS")
          while IFS= read -r spec; do
            [ -n "$spec" ] && args+=(--arm "$spec")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$EXTRA_ARMS")
          n=$(python nn/rnad/input_ab.py pending "${args[@]}")
          echo "まだ届いていない run: $n 本（$ONLY）"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.pending.outputs.n != '0' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.pending.outputs.n != '0' }}
        with:
          workspaces: rl-env
      - name: Install
        if: ${{ steps.pending.outputs.n != '0' }}
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "numpy>=1.26" "maturin>=1.5,<2"
          maturin build --release -m rl-env/Cargo.toml -o wheels
          python -m pip install -q wheels/*.whl
          python -c "import tsuitate_rl, torch; print(torch.__version__, tsuitate_rl.NUM_PLANES_V5)"
      - name: Train
        if: ${{ steps.pending.outputs.n != '0' }}
        env:
          EXPORT_EVERY: ${{ inputs.export_every }}
          STAGE_MINUTES: ${{ inputs.stage_minutes }}
        run: |
          set -euo pipefail
          args=(--root "$GITHUB_WORKSPACE/iab" --arms "$ARMS" --seeds "$SEEDS" --only "$ONLY" --steps "$STEPS")
          while IFS= read -r spec; do
            [ -n "$spec" ] && args+=(--arm "$spec")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$EXTRA_ARMS")
          cd nn
          python rnad/input_ab.py run "${args[@]}" --book "$GITHUB_WORKSPACE/rl_openings.json" --jobs 4 \
            --export-every "$EXPORT_EVERY" --time-limit "$((STAGE_MINUTES * 60))" --poll 30 --report-every 900
      - name: Status
        if: ${{ always() && steps.pending.outputs.n != '0' }}
        run: |
          set -euo pipefail
          python nn/rnad/input_ab.py status iab | tee -a "$GITHUB_STEP_SUMMARY"
          for d in iab/*/; do
            echo "--- $d"
            tail -n 3 "$d/stdout.log" 2>/dev/null | cut -c1-300 || true
          done
      - uses: actions/upload-artifact@v4
        # 途中で落ちても、そこまでの状態を置く（次の段と集計が使う）
        if: ${{ always() && steps.pending.outputs.n != '0' }}
        with:
          name: iab-train-${{ matrix.shard.id }}
          path: iab
          overwrite: true
          if-no-files-found: error
